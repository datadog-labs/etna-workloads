# Build configuration used for every rustc-etna result (base, injected builds).
profile = "compiler"
change-id = "ignore"
[build]
compiler-docs = false
docs = false
extended = false
[rust]
debug-assertions = true
debug-logging = true
incremental = true
verbose-tests = true
download-rustc = false
deny-warnings = false
[llvm]
download-ci-llvm = true
assertions = false
